<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POC 3 - WebGL + WASM Wind Trails</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #1a1a2e;
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
        }
        .container { display: flex; height: 100vh; }
        .controls {
            width: 320px;
            padding: 20px;
            background: #16213e;
            overflow-y: auto;
        }
        .canvas-container { flex: 1; position: relative; }
        canvas { display: block; width: 100%; height: 100%; }
        h1 { font-size: 1.2em; margin-bottom: 20px; color: #60a5fa; }
        .control-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-size: 0.9em; color: #a0aec0; }
        input[type="range"] { width: 100%; margin-bottom: 5px; }
        .value { font-size: 0.85em; color: #60a5fa; }
        .stats {
            background: #0f3460;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
        }
        .stat-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 0.9em;
        }
        .stat-label { color: #a0aec0; }
        .stat-value { color: #60a5fa; font-family: monospace; }
        .legend {
            margin-top: 20px;
            padding: 15px;
            background: #0f3460;
            border-radius: 8px;
        }
        .legend-item {
            display: flex;
            align-items: center;
            margin-bottom: 8px;
            font-size: 0.85em;
        }
        .legend-color {
            width: 20px;
            height: 4px;
            margin-right: 10px;
            border-radius: 2px;
        }
        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 1.5em;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="controls">
            <h1>POC 3: Wind Trails</h1>
            <p style="font-size: 0.85em; color: #a0aec0; margin-bottom: 20px;">
                Trail rendering with shift approach,<br>
                quads generated in WASM
            </p>

            <div class="control-group">
                <label>Particle Count: <span id="countValue">500</span></label>
                <input type="range" id="particleCount" min="100" max="3000" value="500" step="100">
            </div>

            <div class="control-group">
                <label>Trail Length: <span id="trailLengthValue">16</span></label>
                <input type="range" id="trailLength" min="4" max="32" value="16" step="2">
            </div>

            <div class="control-group">
                <label>Trail Width: <span id="trailWidthValue">3</span></label>
                <input type="range" id="trailWidth" min="1" max="10" value="3" step="0.5">
            </div>

            <div class="control-group">
                <label>Trail Opacity: <span id="opacityValue">0.8</span></label>
                <input type="range" id="opacity" min="0.1" max="1.0" value="0.8" step="0.1">
            </div>

            <div class="control-group">
                <label>Wind Speed: <span id="windSpeedValue">5</span></label>
                <input type="range" id="windSpeed" min="1" max="15" value="5" step="1">
            </div>

            <div class="control-group">
                <label>Max Age: <span id="maxAgeValue">80</span></label>
                <input type="range" id="maxAge" min="20" max="150" value="80" step="10">
            </div>

            <div class="control-group">
                <label>NaN Region Size: <span id="nanSizeValue">20</span>%</label>
                <input type="range" id="nanSize" min="0" max="50" value="20" step="5">
            </div>

            <div class="stats">
                <div class="stat-row">
                    <span class="stat-label">FPS:</span>
                    <span class="stat-value" id="fps">0</span>
                </div>
                <div class="stat-row">
                    <span class="stat-label">Active Particles:</span>
                    <span class="stat-value" id="activeParticles">0</span>
                </div>
                <div class="stat-row">
                    <span class="stat-label">Trail Vertices:</span>
                    <span class="stat-value" id="vertexCount">0</span>
                </div>
                <div class="stat-row">
                    <span class="stat-label">WASM Update:</span>
                    <span class="stat-value" id="wasmTime">0 ms</span>
                </div>
            </div>

            <div class="legend">
                <div class="legend-item">
                    <div class="legend-color" style="background: linear-gradient(90deg, #60a5fa, #60a5fa00);"></div>
                    <span>Trail (HEAD → TAIL fade)</span>
                </div>
                <div class="legend-item">
                    <div class="legend-color" style="background: #374151;"></div>
                    <span>NaN Region (No Data)</span>
                </div>
            </div>
        </div>
        <div class="canvas-container">
            <canvas id="canvas"></canvas>
            <div class="loading" id="loading">Loading WASM...</div>
        </div>
    </div>

    <script type="module">
        import init, {
            ParticleSimulator,
            WindSampler,
            TrailManager,
            TrailVertexBuilder
        } from './wasm/meteo_animation_wasm.js';

        // =========================================================================
        // Generate Wind Texture with NaN Regions
        // =========================================================================

        function generateWindTexture(size, nanPercent, windSpeedMax = 10) {
            const data = new Uint8Array(size * size * 4);

            const nanRegions = [];
            const numRegions = Math.floor(2 + Math.random() * 3);
            const regionRadius = size * Math.sqrt(nanPercent / 100 / numRegions / Math.PI);

            for (let i = 0; i < numRegions; i++) {
                nanRegions.push({
                    x: Math.random() * size,
                    y: Math.random() * size,
                    r: regionRadius * (0.5 + Math.random())
                });
            }

            for (let y = 0; y < size; y++) {
                for (let x = 0; x < size; x++) {
                    const idx = (y * size + x) * 4;

                    let isNaN = false;
                    for (const region of nanRegions) {
                        const dx = x - region.x;
                        const dy = y - region.y;
                        if (dx * dx + dy * dy < region.r * region.r) {
                            isNaN = true;
                            break;
                        }
                    }

                    if (isNaN) {
                        data[idx + 0] = 128;
                        data[idx + 1] = 128;
                        data[idx + 2] = 0;
                        data[idx + 3] = 0;
                    } else {
                        const cx = size / 2;
                        const cy = size / 2;
                        const dx = x - cx;
                        const dy = y - cy;
                        const dist = Math.sqrt(dx * dx + dy * dy);
                        const angle = Math.atan2(dy, dx) + Math.PI / 2;

                        const windStrength = (0.5 + 0.3 * Math.sin(dist / 20)) * windSpeedMax;
                        const u = Math.cos(angle) * windStrength;
                        const v = Math.sin(angle) * windStrength;

                        data[idx + 0] = Math.floor(Math.max(0, Math.min(255, (u + 15) / 30 * 255)));
                        data[idx + 1] = Math.floor(Math.max(0, Math.min(255, (v + 15) / 30 * 255)));
                        data[idx + 2] = Math.floor(Math.min(255, windStrength / 15 * 255));
                        data[idx + 3] = 255;
                    }
                }
            }

            return { data, nanRegions };
        }

        // =========================================================================
        // WebGL Shaders
        // =========================================================================

        const BG_VERTEX_SHADER = `#version 300 es
            out vec2 v_uv;
            void main() {
                vec2 positions[6] = vec2[](
                    vec2(-1, -1), vec2(1, -1), vec2(-1, 1),
                    vec2(-1, 1), vec2(1, -1), vec2(1, 1)
                );
                vec2 uvs[6] = vec2[](
                    vec2(0, 1), vec2(1, 1), vec2(0, 0),
                    vec2(0, 0), vec2(1, 1), vec2(1, 0)
                );
                gl_Position = vec4(positions[gl_VertexID], 0.0, 1.0);
                v_uv = uvs[gl_VertexID];
            }
        `;

        const BG_FRAGMENT_SHADER = `#version 300 es
            precision mediump float;
            in vec2 v_uv;
            out vec4 fragColor;
            uniform sampler2D u_wind_texture;

            void main() {
                vec4 wind = texture(u_wind_texture, v_uv);
                if (wind.a < 0.5) {
                    fragColor = vec4(0.12, 0.12, 0.18, 1.0);
                } else {
                    float mag = wind.b;
                    fragColor = vec4(0.04 + mag * 0.03, 0.05 + mag * 0.04, 0.10 + mag * 0.05, 1.0);
                }
            }
        `;

        // Trail shader - receives pre-built vertices from WASM
        const TRAIL_VERTEX_SHADER = `#version 300 es
            precision highp float;

            in vec2 a_position;
            in float a_alpha;
            in vec3 a_color;

            uniform vec2 u_bounds_min;
            uniform vec2 u_bounds_max;

            out vec4 v_color;

            void main() {
                vec2 normalized = (a_position - u_bounds_min) / (u_bounds_max - u_bounds_min);
                vec2 clip = normalized * 2.0 - 1.0;
                gl_Position = vec4(clip.x, -clip.y, 0.0, 1.0);
                v_color = vec4(a_color, a_alpha);
            }
        `;

        const TRAIL_FRAGMENT_SHADER = `#version 300 es
            precision mediump float;
            in vec4 v_color;
            out vec4 fragColor;

            void main() {
                fragColor = v_color;
            }
        `;

        // =========================================================================
        // Shader Helpers
        // =========================================================================

        function createShader(gl, type, source) {
            const shader = gl.createShader(type);
            gl.shaderSource(shader, source);
            gl.compileShader(shader);
            if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
                console.error('Shader compile error:', gl.getShaderInfoLog(shader));
                gl.deleteShader(shader);
                return null;
            }
            return shader;
        }

        function createProgram(gl, vs, fs) {
            const program = gl.createProgram();
            gl.attachShader(program, vs);
            gl.attachShader(program, fs);
            gl.linkProgram(program);
            if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
                console.error('Program link error:', gl.getProgramInfoLog(program));
                gl.deleteProgram(program);
                return null;
            }
            return program;
        }

        // =========================================================================
        // Main
        // =========================================================================

        async function main() {
            const wasm = await init();
            document.getElementById('loading').style.display = 'none';

            const canvas = document.getElementById('canvas');
            const gl = canvas.getContext('webgl2');
            if (!gl) {
                alert('WebGL 2 not supported!');
                return;
            }

            function resize() {
                canvas.width = canvas.clientWidth * window.devicePixelRatio;
                canvas.height = canvas.clientHeight * window.devicePixelRatio;
                gl.viewport(0, 0, canvas.width, canvas.height);
            }
            resize();
            window.addEventListener('resize', resize);

            // ==================== Background Program ====================
            const bgVs = createShader(gl, gl.VERTEX_SHADER, BG_VERTEX_SHADER);
            const bgFs = createShader(gl, gl.FRAGMENT_SHADER, BG_FRAGMENT_SHADER);
            const bgProgram = createProgram(gl, bgVs, bgFs);
            const bgWindTexLoc = gl.getUniformLocation(bgProgram, 'u_wind_texture');

            // ==================== Trail Program ====================
            const trailVs = createShader(gl, gl.VERTEX_SHADER, TRAIL_VERTEX_SHADER);
            const trailFs = createShader(gl, gl.FRAGMENT_SHADER, TRAIL_FRAGMENT_SHADER);
            const trailProgram = createProgram(gl, trailVs, trailFs);

            const posLoc = gl.getAttribLocation(trailProgram, 'a_position');
            const alphaLoc = gl.getAttribLocation(trailProgram, 'a_alpha');
            const colorLoc = gl.getAttribLocation(trailProgram, 'a_color');
            const boundsMinLoc = gl.getUniformLocation(trailProgram, 'u_bounds_min');
            const boundsMaxLoc = gl.getUniformLocation(trailProgram, 'u_bounds_max');

            // ==================== Trail VAO & Buffer ====================
            const trailVao = gl.createVertexArray();
            gl.bindVertexArray(trailVao);

            const trailBuffer = gl.createBuffer();
            gl.bindBuffer(gl.ARRAY_BUFFER, trailBuffer);

            // Vertex format: [x, y, alpha, r, g, b] = 6 floats = 24 bytes
            const FLOATS_PER_VERTEX = 6;
            const STRIDE = FLOATS_PER_VERTEX * 4;

            gl.enableVertexAttribArray(posLoc);
            gl.vertexAttribPointer(posLoc, 2, gl.FLOAT, false, STRIDE, 0);
            gl.enableVertexAttribArray(alphaLoc);
            gl.vertexAttribPointer(alphaLoc, 1, gl.FLOAT, false, STRIDE, 8);
            gl.enableVertexAttribArray(colorLoc);
            gl.vertexAttribPointer(colorLoc, 3, gl.FLOAT, false, STRIDE, 12);

            // ==================== WASM Objects ====================
            const MAX_PARTICLES = 3000;
            let currentTrailLength = 16;

            let simulator = new ParticleSimulator(MAX_PARTICLES);
            let trails = new TrailManager(MAX_PARTICLES, currentTrailLength);
            let vertexBuilder = new TrailVertexBuilder(MAX_PARTICLES, currentTrailLength);

            // Pre-allocate buffer
            const maxVertices = MAX_PARTICLES * (currentTrailLength - 1) * 6;
            gl.bufferData(gl.ARRAY_BUFFER, maxVertices * STRIDE, gl.DYNAMIC_DRAW);

            // ==================== Wind Texture + WindSampler ====================
            const WIND_TEX_SIZE = 256;
            let windTexture = gl.createTexture();
            const windSampler = new WindSampler(WIND_TEX_SIZE, WIND_TEX_SIZE);

            function regenerateWindTexture(nanPercent, windSpeedMax = 10) {
                const { data } = generateWindTexture(WIND_TEX_SIZE, nanPercent, windSpeedMax);

                gl.bindTexture(gl.TEXTURE_2D, windTexture);
                gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, WIND_TEX_SIZE, WIND_TEX_SIZE, 0, gl.RGBA, gl.UNSIGNED_BYTE, data);
                gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
                gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
                gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
                gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);

                windSampler.set_data(data);
            }

            // Function to recreate trail objects when trail length changes
            function recreateTrailObjects(newTrailLength) {
                trails = new TrailManager(MAX_PARTICLES, newTrailLength);
                vertexBuilder = new TrailVertexBuilder(MAX_PARTICLES, newTrailLength);

                const newMaxVertices = MAX_PARTICLES * (newTrailLength - 1) * 6;
                gl.bindBuffer(gl.ARRAY_BUFFER, trailBuffer);
                gl.bufferData(gl.ARRAY_BUFFER, newMaxVertices * STRIDE, gl.DYNAMIC_DRAW);

                currentTrailLength = newTrailLength;
            }

            // ==================== Controls ====================
            const particleCountSlider = document.getElementById('particleCount');
            const trailLengthSlider = document.getElementById('trailLength');
            const trailWidthSlider = document.getElementById('trailWidth');
            const opacitySlider = document.getElementById('opacity');
            const windSpeedSlider = document.getElementById('windSpeed');
            const maxAgeSlider = document.getElementById('maxAge');
            const nanSizeSlider = document.getElementById('nanSize');

            particleCountSlider.oninput = () => document.getElementById('countValue').textContent = particleCountSlider.value;
            trailLengthSlider.oninput = () => {
                document.getElementById('trailLengthValue').textContent = trailLengthSlider.value;
                recreateTrailObjects(parseInt(trailLengthSlider.value));
            };
            trailWidthSlider.oninput = () => document.getElementById('trailWidthValue').textContent = trailWidthSlider.value;
            opacitySlider.oninput = () => document.getElementById('opacityValue').textContent = opacitySlider.value;
            windSpeedSlider.oninput = () => document.getElementById('windSpeedValue').textContent = windSpeedSlider.value;
            maxAgeSlider.oninput = () => document.getElementById('maxAgeValue').textContent = maxAgeSlider.value;
            nanSizeSlider.oninput = () => {
                document.getElementById('nanSizeValue').textContent = nanSizeSlider.value;
                regenerateWindTexture(parseInt(nanSizeSlider.value), 10);
            };

            // Initial setup
            regenerateWindTexture(20);
            windSampler.set_bounds(0, 0, canvas.width, canvas.height);

            window.addEventListener('resize', () => {
                windSampler.set_bounds(0, 0, canvas.width, canvas.height);
            });

            // ==================== Blending ====================
            gl.enable(gl.BLEND);
            gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);

            // ==================== Stats ====================
            let frameCount = 0;
            let lastFpsTime = performance.now();
            let wasmTimeAvg = 0;

            // ==================== Animation Loop ====================
            let lastTime = performance.now();

            function frame() {
                const now = performance.now();
                const deltaTime = (now - lastTime) / 1000;
                lastTime = now;

                const targetCount = parseInt(particleCountSlider.value);
                const trailWidth = parseFloat(trailWidthSlider.value);
                const opacity = parseFloat(opacitySlider.value);
                const windSpeed = parseFloat(windSpeedSlider.value);
                const maxAge = parseFloat(maxAgeSlider.value);

                // ==================== WASM Update ====================
                const wasmStart = performance.now();

                // Update particles AND trails together
                simulator.update_with_trails(
                    windSampler,
                    trails,
                    0, 0,
                    canvas.width, canvas.height,
                    deltaTime,
                    windSpeed,
                    maxAge,
                    now / 1000,
                    targetCount
                );

                // Build trail vertices
                vertexBuilder.build(
                    trails,
                    targetCount,
                    trailWidth * window.devicePixelRatio,
                    opacity,
                    0.376, 0.647, 0.980  // Blue color (#60a5fa)
                );

                const wasmEnd = performance.now();
                wasmTimeAvg = wasmTimeAvg * 0.9 + (wasmEnd - wasmStart) * 0.1;

                // Get vertex data
                const vertexCount = vertexBuilder.get_vertex_count();
                const ptr = vertexBuilder.get_vertices_ptr();
                const vertices = new Float32Array(wasm.memory.buffer, ptr, vertexCount * FLOATS_PER_VERTEX);

                // ==================== Render ====================
                gl.clearColor(0.06, 0.06, 0.12, 1.0);
                gl.clear(gl.COLOR_BUFFER_BIT);

                // Draw background (NaN regions)
                gl.useProgram(bgProgram);
                gl.activeTexture(gl.TEXTURE0);
                gl.bindTexture(gl.TEXTURE_2D, windTexture);
                gl.uniform1i(bgWindTexLoc, 0);
                gl.drawArrays(gl.TRIANGLES, 0, 6);

                // Draw trails
                if (vertexCount > 0) {
                    gl.bindBuffer(gl.ARRAY_BUFFER, trailBuffer);
                    gl.bufferSubData(gl.ARRAY_BUFFER, 0, vertices);

                    gl.useProgram(trailProgram);
                    gl.uniform2f(boundsMinLoc, 0, 0);
                    gl.uniform2f(boundsMaxLoc, canvas.width, canvas.height);

                    gl.bindVertexArray(trailVao);
                    gl.drawArrays(gl.TRIANGLES, 0, vertexCount);
                }

                // FPS counter
                frameCount++;
                if (now - lastFpsTime > 1000) {
                    document.getElementById('fps').textContent = frameCount;
                    document.getElementById('activeParticles').textContent = targetCount;
                    document.getElementById('vertexCount').textContent = vertexCount.toLocaleString();
                    document.getElementById('wasmTime').textContent = wasmTimeAvg.toFixed(2) + ' ms';
                    frameCount = 0;
                    lastFpsTime = now;
                }

                requestAnimationFrame(frame);
            }

            frame();
        }

        main().catch(console.error);
    </script>
</body>
</html>
